services:
  app:
    container_name: paaa-tool-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # App -> DB (internal, unencrypted HTTP on the private Docker network)
      DATABASE_URL: ${DATABASE_URL:-http://db:8080}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      # SvelteKit (adapter-node) binds to these
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      ORIGIN: ${ORIGIN}
      # Header check for determining client IP transparency
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: 1
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Session JWT secret (required: app refuses to start without it)
      AUTH_SECRET: ${AUTH_SECRET}
      # App version (informational, see .env / README)
      APP_VERSION: ${APP_VERSION:-}
      # Schema push safety: set to "true" only to approve destructive changes
      DRIZZLE_FORCE_PUSH: ${DRIZZLE_FORCE_PUSH:-false}
      # Max request body accepted by the Bun adapter. WITHOUT this the adapter
      # defaults to 512K, which silently overrides the 5 MB / 20 MB ceilings
      # declared in src/lib/server/uploads.ts — large uploads fail with an
      # opaque 413 before ever reaching the handler.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-21M}
    depends_on:
      - db
    # Sized for event day (CaTE): several hundred concurrent players.
    #
    # Memory is the real constraint, not CPU. Every in-flight upload is buffered
    # whole in RAM (BODY_SIZE_LIMIT is 21M) and readValidatedImage copies the
    # buffer again while validating, so concurrent photo submissions dominate
    # peak usage. 4 GB leaves room for dozens of simultaneous uploads on top of
    # SSR; idle usage is ~50 MB.
    #
    # CPU is capped at 4 deliberately: Bun executes JavaScript on ONE thread, so
    # extra cores cannot speed up request handling. What they do help is the
    # crypto threadpool (bcrypt on login, PBKDF2 on Codex) and GC, which is why
    # this is 4 and not 1 — but raising it further buys nothing.
    mem_limit: 4g
    cpus: 4.0
    volumes:
      # Persist user uploads and team data across container rebuilds
      - ./paaa_data:/app/paaa_data
      - ./paaa_data/uploads:/app/uploads
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      plv_network:
        aliases:
          - app

  db:
    container_name: paaa-tool-db
    image: ghcr.io/tursodatabase/libsql-server:latest
    # Persist database + namespace files via local bind mount (NOT a named volume)
    volumes:
      - ./sqld-data:/var/lib/sqld
    environment:
      # Listen on all interfaces INSIDE the container/network (no host port publishing)
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_ADMIN_LISTEN_ADDR: 0.0.0.0:9090
      # Optional: protect admin API (recommended). Leave empty to disable auth.
      LIBSQL_ADMIN_AUTH_KEY: ${LIBSQL_ADMIN_AUTH_KEY:-}
    # IMPORTANT: the image uses a wrapper entrypoint; override it so flags aren't duplicated.
    entrypoint: ["/bin/sqld"]
    command:
      # Namespaces disabled by default; enable for multi-tenant operation.
      - --enable-namespaces
      # Allow internal unencrypted HTTP traffic (no TLS flags set).
      - --http-listen-addr
      - 0.0.0.0:8080
      # Admin API used for namespace management (internal only).
      - --admin-listen-addr
      - 0.0.0.0:9090
      # Store DB file under the bind mount (set only ONCE).
      - --db-path
      - /var/lib/sqld/data.sqld
    expose:
      - "8080"
      - "9090"
    restart: unless-stopped
    # SQLite is memory-light (idle ~8 MB); the extra RAM goes to page cache,
    # which is what helps when hundreds of players read the leaderboard at once.
    mem_limit: 2g
    cpus: 2.0
    networks:
      plv_network:
        aliases:
          - db

networks:
  plv_network:
    external: true
    name: plv_network
